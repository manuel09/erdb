services:
  app:
    image: ghcr.io/realbestia1/erdb:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ERDB_WORKERS: ${ERDB_WORKERS:-auto}
      ERDB_SHARP_CONCURRENCY: ${ERDB_SHARP_CONCURRENCY:-1}
      ERDB_SOURCE_CACHE_MAX_FILES: ${ERDB_SOURCE_CACHE_MAX_FILES:-10000}
      ERDB_FETCH_TIMEOUT_MS: ${ERDB_FETCH_TIMEOUT_MS:-10000}
      ERDB_FETCH_RETRIES: ${ERDB_FETCH_RETRIES:-2}
      ERDB_FETCH_MAX_CONCURRENT: ${ERDB_FETCH_MAX_CONCURRENT:-96}
    ports:
      - '${ERDB_HTTP_PORT:-3000}:3000'
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
